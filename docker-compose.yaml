version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: semantic-code-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=DEBUG

  ollama:
    image: ollama/ollama:latest
    container_name: semantic-code-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_THREAD=8
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_GPU_LAYERS=35
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 16G
        reservations:
          cpus: '4'
          memory: 8G
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: semantic-code-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=semantic_layer
      - POSTGRES_USER=semantic_user
      # ADD POSTGRES_PASSWORD for dev
    restart: unless-stopped

volumes:
  qdrant_data:
  ollama_data:
  postgres_data:
