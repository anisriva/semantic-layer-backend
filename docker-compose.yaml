version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: semantic-code-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: semantic-code-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_THREAD=6
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_QUEUE=128
      # Apple Silicon GPU acceleration (reduced for stability)
      - OLLAMA_GPU_LAYERS=20
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 12G
        reservations:
          cpus: '4'
          memory: 8G
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: semantic-code-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=semantic_layer
      - POSTGRES_USER=semantic_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    restart: unless-stopped

  # API server and worker are run manually for now (`npm run dev:api` /
  # `npm run dev:worker` against the host .env, which already points at
  # localhost:5432/6333/11434 — see requests/README.md). Left here,
  # commented out, as the ready-to-use definition for when they're moved
  # back into compose (Dockerfile/.env.docker/.env.docker.example already
  # exist for that): uncomment both blocks and run
  # `podman-compose up -d --build api worker`.
  #
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semantic-code-api
    command: ["node", "dist/src/api-server.js"]
    ports:
      - "3000:3000"
    volumes:
      - ${ENV_FILE:-./.env.docker}:/app/.env:ro
      - ${REPO_WORKSPACE:-./workspace}:/workspace
    depends_on:
      - postgres
      - qdrant
    restart: unless-stopped
  
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/src/worker.js"]
    deploy:
      replicas: 1
    volumes:
      - ${ENV_FILE:-./.env.docker}:/app/.env:ro
      - ${REPO_WORKSPACE:-./workspace}:/workspace
    depends_on:
      - postgres
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
  ollama_data:
  postgres_data:
