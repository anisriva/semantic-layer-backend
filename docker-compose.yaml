version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: semantic-code-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=DEBUG

volumes:
  qdrant_data:
